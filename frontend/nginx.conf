server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理到后端服务（compose 服务名 backend）；前端代码全程使用相对路径 /api
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;          # AI 识别/出题是长请求
        client_max_body_size 25m;         # 与后端请求体上限一致（含图片 base64）
    }

    # SPA 回退：前端是单页应用，未知路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
